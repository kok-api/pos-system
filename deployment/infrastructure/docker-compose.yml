name: ${COMPOSE_PROJECT_NAME:-pos-system}

x-java-service: &java-service
  restart: unless-stopped
  init: true
  networks:
    - pos-network
  depends_on:
    postgres:
      condition: service_healthy
  environment: &jpa-service-environment
    DB_USERNAME: ${POSTGRES_USER:-posuser}
    DB_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}
    JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom
    TZ: UTC
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 40s
  logging: &default-logging
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  healthcheck: &application-healthcheck
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${SERVER_PORT}/actuator/health | grep -q '\"status\":\"UP\"'"]
    interval: 15s
    timeout: 5s
    retries: 12
    start_period: 45s

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - pos-network
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos_user_db}
      POSTGRES_USER: ${POSTGRES_USER:-posuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      TZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - pos-network
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging

  # All services share the single logical database created by POSTGRES_DB.

  user-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: Dockerfile
      target: user-service
    environment:
      <<: *jpa-service-environment
      SERVER_PORT: 8081
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_user_db}
      JWT_ISSUER: ${JWT_ISSUER:-pos-system/user-service}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-pos-system}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64:?Copy .env.example to .env and set JWT_SECRET_BASE64}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-PT15M}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-P30D}
      AUTH_MAX_FAILED_ATTEMPTS: ${AUTH_MAX_FAILED_ATTEMPTS:-5}
      AUTH_LOCK_DURATION: ${AUTH_LOCK_DURATION:-PT15M}
      FILE_UPLOAD_SERVER_PATH: ${FILE_UPLOAD_SERVER_PATH:-/var/lib/pos/uploads/}
      FILE_UPLOAD_BASE_URI: ${FILE_UPLOAD_BASE_URI:-http://localhost:8888/server/image/}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    ports:
      - "127.0.0.1:${USER_SERVICE_PORT:-8081}:8081"

  catalog-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: Dockerfile
      target: catalog-service
    environment:
      <<: *jpa-service-environment
      SERVER_PORT: 8082
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_user_db}
      CATALOG_FILE_UPLOAD_SERVER_PATH: ${CATALOG_FILE_UPLOAD_SERVER_PATH:-/var/lib/pos/catalog-uploads}
      CATALOG_FILE_UPLOAD_BASE_URI: ${CATALOG_FILE_UPLOAD_BASE_URI:-http://localhost:8080/api/v1/files}
    volumes:
      - catalog-uploads:/var/lib/pos/catalog-uploads
    ports:
      - "127.0.0.1:${CATALOG_SERVICE_PORT:-8082}:8082"

  order-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: Dockerfile
      target: order-service
    environment:
      <<: *jpa-service-environment
      SERVER_PORT: 8083
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_user_db}
    ports:
      - "127.0.0.1:${ORDER_SERVICE_PORT:-8083}:8083"

  inventory-service:
    <<: *java-service
    build:
      context: ../..
      dockerfile: Dockerfile
      target: inventory-service
    environment:
      <<: *jpa-service-environment
      SERVER_PORT: 8084
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_user_db}
    ports:
      - "127.0.0.1:${INVENTORY_SERVICE_PORT:-8084}:8084"

  api-gateway:
    restart: unless-stopped
    init: true
    build:
      context: ../..
      dockerfile: Dockerfile
      target: api-gateway
    networks:
      - pos-network
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      inventory-service:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      SPRING_R2DBC_URL: r2dbc:postgresql://postgres:5432/${POSTGRES_DB:-pos_user_db}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-posuser}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
      USER_SERVICE_URL: http://user-service:8081
      CATALOG_SERVICE_URL: http://catalog-service:8082
      ORDER_SERVICE_URL: http://order-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      AUTH_VERIFICATION_URL: http://user-service:8081/api/v1/auth/verify-token
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=75.0 -XX:InitialRAMPercentage=25.0 -Djava.security.egd=file:/dev/./urandom
      TZ: UTC
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 40s
    healthcheck:
      <<: *application-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
    logging: *default-logging

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["tools"]
    restart: unless-stopped
    networks:
      - pos-network
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

networks:
  pos-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  catalog-uploads:
  pgadmin-data:
